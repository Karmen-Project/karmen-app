# ── Servidor ────────────────────────────────────────────────────
sonar.host.url=http://localhost:9000
# Token: NUNCA hardcodear aquí. Pasar como variable de entorno:
#   export SONAR_TOKEN=tu-token && sonar-scanner
#   o: sonar-scanner -Dsonar.token=$SONAR_TOKEN
# ── Identificación ──────────────────────────────────────────────
sonar.projectKey=karmen-frontend
sonar.projectName=Karmen Frontend
sonar.projectVersion=0.1.0

# ── Fuentes ──────────────────────────────────────────────────────
sonar.sources=src
sonar.sourceEncoding=UTF-8

# ── Exclusiones ──────────────────────────────────────────────────
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  **/*.test.jsx,\
  **/*.test.js,\
  **/*.spec.jsx,\
  **/*.spec.js,\
  src/main.jsx

# ── Cobertura (si se agrega Jest en el futuro) ───────────────────
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.testExecutionReportPaths=coverage/test-reporter.xml

# ── Lenguaje ─────────────────────────────────────────────────────
sonar.language=js
