global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: karmen

scrape_configs:
  - job_name: 'karmen-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'
